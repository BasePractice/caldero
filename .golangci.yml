# Набор подобран под дефекты, которые уже встречались в этом репозитории:
# проглоченные ошибки, незакрытые rows, запросы без контекста, возврат nil
# вместо ошибки.
version: "2"

run:
  timeout: 5m
  # Без тега integration линтер не видит интеграционные тесты вовсе —
  # а это тесты репозиториев, то есть весь код, который ходит в базу.
  # Долг там копился молча: сравнение ошибок через != перестало бы
  # проверять хоть что-то в день, когда ошибку начнут оборачивать.
  build-tags:
    - integration

linters:
  enable:
    - errcheck        # проглоченные ошибки — источник большей части найденных дефектов
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose       # незакрытое тело ответа
    - sqlclosecheck   # незакрытый *sql.Rows
    - rowserrcheck    # непроверенный rows.Err()
    - contextcheck    # потерянный контекст
    - nilerr          # return nil при непустой ошибке
    - errorlint       # сравнение ошибок без errors.Is/As
    - gosec

  settings:
    gosec:
      excludes:
        # G501: протокол gravatar требует MD5, и заменить его нельзя,
        # не сломав совместимость. Хеш там не средство защиты.
        - G501
    errcheck:
      check-type-assertions: true

  exclusions:
    rules:

      # В тестах допустимы менее строгие правила.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

      # tools/ — инструменты разработки, а не сервисы: они читают и пишут
      # файлы этого же репозитория по путям, которые сами и составили.
      # Модель угроз gosec (недоверенный ввод, права на чужой машине)
      # к ним не относится, а сгенерированные документы обязаны остаться
      # читаемыми — 0600 сделал бы их доступными только владельцу.
      - path: ^tools/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
