services:
  krakend:
    image: krakend:latest
    volumes:
      - ./config/krakend:/etc/krakend
    ports:
      - "1234:1234"
      - "8080:8080"
      - "8090:8090"
    # Конфигурация — шаблон: провайдер аутентификации выбирается переменными
    # окружения, а не второй копией конфига (см. docs/adr/0001-auth-provider.md).
    command: [ "run", "-d", "-c", "/etc/krakend/krakend.tmpl" ]
    environment:
      FC_ENABLE: "1"
      FC_OUT: /tmp/krakend.rendered.json
      KRAKEND_NAME: Caldero
      AUTH_HOST: ${AUTH_HOST:-http://keycloak:8080}
      AUTH_JWKS_PATH: ${AUTH_JWKS_PATH:-/realms/krakend/protocol/openid-connect/certs}
      AUTH_TOKEN_PATH: ${AUTH_TOKEN_PATH:-/realms/krakend/protocol/openid-connect/token}
      AUTH_ROLES_CLAIM: ${AUTH_ROLES_CLAIM:-realm_access.roles}
      INFLUXDB_USER: ${INFLUXDB_USER:-krakend-dev}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD не задан}
    depends_on:
      - jaeger
      - influxdb
      - elasticsearch
      - users
      - credit
      - account
  grafana:
    image: grafana/grafana
    ports:
      - "4000:3000"
    environment:
      INFLUXDB_USER: ${INFLUXDB_USER:-krakend-dev}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD не задан}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD не задан}
    volumes:
      - "./config/grafana/datasources/all.yml:/etc/grafana/provisioning/datasources/all.yml"
      - "./config/grafana/dashboards/all.yml:/etc/grafana/provisioning/dashboards/all.yml"
      - "./config/grafana/krakend:/var/lib/grafana/dashboards/krakend"
      - "./config/grafana/prometheus:/var/lib/grafana/dashboards/prometheus"
  influxdb:
    image: influxdb
    environment:
      - "INFLUXDB_DB=krakend"
      - "INFLUXDB_USER=${INFLUXDB_USER:-krakend-dev}"
      - "INFLUXDB_USER_PASSWORD=${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD не задан, скопируйте .env.example в .env}"
      - "INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER:-admin}"
      - "INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD не задан}"
    ports:
      - "8086:8086"
  jaeger:
    image: jaegertracing/all-in-one:1
    ports:
      - "16686:16686"
      - "14268:14268"
  elasticsearch:
    image: elasticsearch:8.18.0
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "xpack.security.transport.ssl.enabled=false"
      - "xpack.security.http.ssl.enabled=false"
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    ports:
      - "19200:9200"
      - "9300:9300"
  kibana:
    image: kibana:8.18.0
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  logstash:
    image: logstash:8.18.0
    ports:
      - "12201:12201/udp"
      - "5044:5044"
    environment:
      - "xpack.monitoring.elasticsearch.url=http://elasticsearch:9200"
    volumes:
      - ./config/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    command: [ "-f", "/usr/share/logstash/pipeline/logstash.conf" ]
#  filebeat:
#    image: elastic/filebeat:8.17.5
#    depends_on:
#      logstash:
#        condition: service_started
#    volumes:
#      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
#      - ./.logs:/logs
  prometheus:
    image: prom/prometheus
    volumes:
      - ./config/prometheus/:/etc/prometheus/
      - ./.prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9099:9090"
    restart: always
  keycloak:
    image: keycloak/keycloak:26.0
    # Профиль: в режиме собственного провайдера Keycloak не нужен.
    # Запуск: docker compose --profile keycloak up
    profiles: [ "keycloak" ]
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8085:8080"
    volumes:
      - ./config/keycloak/realms:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD не задан}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-db:5432/keycloak?verifyServerCertificate=false&ssl=allow
      - KC_DB_USERNAME=${POSTGRES_USER:-postgres}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      - KC_DB_SCHEMA=keycloak
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_METRICS_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_LOG_LEVEL=${KC_LOG_LEVEL:-INFO}
      - KEYCLOAK_LOGLEVEL=${KC_LOG_LEVEL:-INFO}
    command: [ "start-dev", "--import-realm" ]
  postgres-db:
    image: postgres
    restart: always
    ports:
      - '25432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
    volumes:
      - ./.pg:/var/lib/postgresql/data
      - ./config/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    healthcheck:
      test: 'redis-cli ping || exit 1'
      interval: 5s
      timeout: 5s
      retries: 3
  wallet:
    image: wish/wallet:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: wallet
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51051"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=wallet
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
#      LOG_FILE: /logs/wallet.log
    volumes:
      - ./.logs/wallet:/logs
  credit:
    image: wish/credit:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: credit
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51052"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=credit
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
#      LOG_FILE: /logs/credit.log
    volumes:
      - ./.logs/credit:/logs
  users:
    image: wish/users:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: users
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51053"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=users
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
      OAUTH2_GLOBAL_SECRET: ${OAUTH2_GLOBAL_SECRET:?OAUTH2_GLOBAL_SECRET не задан, нужно ровно 32 байта}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-http://localhost:8080/api/v1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
#      LOG_FILE: /logs/users.log
    volumes:
      - ./.logs/users:/logs
  account:
    image: wish/account:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: account
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51054"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=account
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
    #      LOG_FILE: /logs/users.log
    volumes:
      - ./.logs/account:/logs