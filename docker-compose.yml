services:
  krakend:
    image: krakend:latest
    volumes:
      - ./config/krakend:/etc/krakend
    ports:
      - "1234:1234"
      - "8080:8080"
      - "8090:8090"
    # Конфигурация — шаблон: провайдер аутентификации выбирается переменными
    # окружения, а не второй копией конфига (см. docs/adr/0001-auth-provider.md).
    command: [ "run", "-d", "-c", "/etc/krakend/krakend.tmpl" ]
    environment:
      FC_ENABLE: "1"
      FC_OUT: /tmp/krakend.rendered.json
      KRAKEND_NAME: Caldero
      AUTH_HOST: ${AUTH_HOST:-http://users:51053}
      AUTH_JWKS_PATH: ${AUTH_JWKS_PATH:-/.well-known/jwks.json}
      AUTH_TOKEN_PATH: ${AUTH_TOKEN_PATH:-/token}
      AUTH_ROLES_CLAIM: ${AUTH_ROLES_CLAIM:-roles}
      INFLUXDB_USER: ${INFLUXDB_USER:-krakend-dev}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD не задан}
    depends_on:
      - jaeger
      - influxdb
      - elasticsearch
      - users
      - credit
      - account
  grafana:
    image: grafana/grafana
    ports:
      - "4000:3000"
    environment:
      INFLUXDB_USER: ${INFLUXDB_USER:-krakend-dev}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD не задан}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD не задан}
    volumes:
      - "./config/grafana/datasources/all.yml:/etc/grafana/provisioning/datasources/all.yml"
      - "./config/grafana/dashboards/all.yml:/etc/grafana/provisioning/dashboards/all.yml"
      - "./config/grafana/krakend:/var/lib/grafana/dashboards/krakend"
      - "./config/grafana/prometheus:/var/lib/grafana/dashboards/prometheus"
  influxdb:
    image: influxdb
    environment:
      - "INFLUXDB_DB=krakend"
      - "INFLUXDB_USER=${INFLUXDB_USER:-krakend-dev}"
      - "INFLUXDB_USER_PASSWORD=${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD не задан, скопируйте .env.example в .env}"
      - "INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER:-admin}"
      - "INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD не задан}"
    ports:
      - "8086:8086"
  jaeger:
    image: jaegertracing/all-in-one:1
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14268:14268"
      # Приёмник OTLP: сервисы отправляют трассы сюда.
      - "4317:4317"
      - "4318:4318"
  elasticsearch:
    image: elasticsearch:8.18.0
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "xpack.security.transport.ssl.enabled=false"
      - "xpack.security.http.ssl.enabled=false"
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    ports:
      - "19200:9200"
      - "9300:9300"
  kibana:
    image: kibana:8.18.0
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  logstash:
    image: logstash:8.18.0
    ports:
      - "12201:12201/udp"
      - "5044:5044"
    environment:
      - "xpack.monitoring.elasticsearch.url=http://elasticsearch:9200"
    volumes:
      - ./config/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    command: [ "-f", "/usr/share/logstash/pipeline/logstash.conf" ]
  filebeat:
    image: elastic/filebeat:8.18.0
    # Конфигурация должна принадлежать root и быть недоступной на запись
    # другим — иначе filebeat отказывается её читать.
    user: root
    command: [ "filebeat", "-e", "--strict.perms=false" ]
    depends_on:
      - logstash
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./.logs:/logs:ro
  prometheus:
    image: prom/prometheus
    volumes:
      - ./config/prometheus/:/etc/prometheus/
      - ./.prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9099:9090"
    restart: always
  keycloak:
    image: keycloak/keycloak:26.0
    # Профиль: в режиме собственного провайдера Keycloak не нужен.
    # Запуск: docker compose --profile keycloak up
    profiles: [ "keycloak" ]
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8085:8080"
    volumes:
      - ./config/keycloak/realms:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD не задан}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-db:5432/keycloak?verifyServerCertificate=false&ssl=allow
      - KC_DB_USERNAME=${POSTGRES_USER:-postgres}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      - KC_DB_SCHEMA=keycloak
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_METRICS_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_LOG_LEVEL=${KC_LOG_LEVEL:-INFO}
      - KEYCLOAK_LOGLEVEL=${KC_LOG_LEVEL:-INFO}
    command: [ "start-dev", "--import-realm" ]
  postgres-db:
    image: postgres
    restart: always
    ports:
      - '25432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
    volumes:
      - ./.pg:/var/lib/postgresql/data
      - ./config/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    healthcheck:
      test: 'redis-cli ping || exit 1'
      interval: 5s
      timeout: 5s
      retries: 3
  wallet:
    image: wish/wallet:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: wallet
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51051"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=wallet
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      LOG_FILE: /logs/wallet.log
    volumes:
      - ./.logs/wallet:/logs
  credit:
    image: wish/credit:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: credit
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      wallet:
        condition: service_healthy
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51052"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=credit
      WALLET_ADDRESS: ${WALLET_ADDRESS:-wallet:51051}
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      LOG_FILE: /logs/credit.log
    volumes:
      - ./.logs/credit:/logs
  users:
    image: wish/users:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: users
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51053"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=users
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OAUTH2_GLOBAL_SECRET: ${OAUTH2_GLOBAL_SECRET:?OAUTH2_GLOBAL_SECRET не задан, нужно ровно 32 байта}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-http://localhost:8080/api/v1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      KEY_MASTER_KEY: ${KEY_MASTER_KEY:-}
      # Коды подтверждения уходят через сервис оповещений.
      NOTIFY_ENDPOINT: ${NOTIFY_ENDPOINT:-http://notify:51055}
      SERVICE_USER_ID: ${SERVICE_USER_ID:-11111111-1111-1111-1111-111111111111}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CONFIRMATION_TTL: ${CONFIRMATION_TTL:-15m}
      CONFIRMATION_COOLDOWN: ${CONFIRMATION_COOLDOWN:-1m}
      CONFIRMATION_RATE_LIMIT: ${CONFIRMATION_RATE_LIMIT:-5}
      CONFIRMATION_RATE_WINDOW: ${CONFIRMATION_RATE_WINDOW:-1h}
      # Внешние провайдеры входа: пустой список выключает соц-вход,
      # настройки каждого провайдера приходят из .env по префиксу.
      SOCIAL_PROVIDERS: ${SOCIAL_PROVIDERS:-}
      SOCIAL_REDIRECT_BASE: ${SOCIAL_REDIRECT_BASE:-http://localhost:8080/api/v1}
      LOG_FILE: /logs/users.log
    volumes:
      - ./.logs/users:/logs
  account:
    image: wish/account:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: account
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51054"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=account
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      LOG_FILE: /logs/account.log
    volumes:
      - ./.logs/account:/logs  notify:
    image: wish/notify:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: notify
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51055"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=notify
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # Пустой токен выключает канал Telegram: лента приложения работает
      # и без бота.
      NOTIFY_TELEGRAM_TOKEN: ${NOTIFY_TELEGRAM_TOKEN:-}
      NOTIFY_TELEGRAM_BOT: ${NOTIFY_TELEGRAM_BOT:-}
      NOTIFY_WS_ORIGINS: ${NOTIFY_WS_ORIGINS:-}
      NOTIFY_RATE_LIMIT: ${NOTIFY_RATE_LIMIT:-10}
      NOTIFY_RATE_WINDOW: ${NOTIFY_RATE_WINDOW:-1m}
      # Адрес почты берётся из профиля: держать вторую копию контактов
      # значит разойтись с ним при первой же смене адреса.
      USERS_ENDPOINT: ${USERS_ENDPOINT:-http://users:51053}
      SERVICE_USER_ID: ${SERVICE_USER_ID:-11111111-1111-1111-1111-111111111111}
      # Пустой SMTP_HOST выключает канал почты целиком.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_UNSUBSCRIBE_URL: ${EMAIL_UNSUBSCRIBE_URL:-http://localhost:8080/api/v1/notify/unsubscribe}
      EMAIL_SECRET: ${EMAIL_SECRET:-}
      # Мессенджер МАКС: протокол задаётся конфигурацией по документации
      # площадки, пустой токен выключает канал.
      NOTIFY_MAX_TOKEN: ${NOTIFY_MAX_TOKEN:-}
      NOTIFY_MAX_BOT: ${NOTIFY_MAX_BOT:-}
      NOTIFY_MAX_API: ${NOTIFY_MAX_API:-}
      NOTIFY_MAX_METHOD_PATH: ${NOTIFY_MAX_METHOD_PATH:-}
      NOTIFY_MAX_SEND_METHOD: ${NOTIFY_MAX_SEND_METHOD:-}
      NOTIFY_MAX_UPDATES_METHOD: ${NOTIFY_MAX_UPDATES_METHOD:-}
      NOTIFY_MAX_CHAT_FIELD: ${NOTIFY_MAX_CHAT_FIELD:-}
      NOTIFY_MAX_TEXT_FIELD: ${NOTIFY_MAX_TEXT_FIELD:-}
      LOG_FILE: /logs/notify.log
    volumes:
      - ./.logs/notify:/logs
  wishlist:
    image: wish/wishlist:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: wishlist
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      wallet:
        condition: service_healthy
      notify:
        condition: service_healthy
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51056"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=wishlist
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      WALLET_ADDRESS: ${WALLET_ADDRESS:-wallet:51051}
      NOTIFY_ENDPOINT: ${NOTIFY_ENDPOINT:-http://notify:51055}
      # От этого идентификатора сервисы ходят друг к другу там, где нужна
      # роль оператора: оповещение чужому пользователю, чтение чужого кошелька.
      SERVICE_USER_ID: ${SERVICE_USER_ID:-11111111-1111-1111-1111-111111111111}
      MARKETPLACE_PROVIDERS: ${MARKETPLACE_PROVIDERS:-STUB}
      MARKETPLACE_CACHE_TTL: ${MARKETPLACE_CACHE_TTL:-10m}
      WISHLIST_RESERVATION_TTL: ${WISHLIST_RESERVATION_TTL:-72h}
      WISHLIST_RELEASE_INTERVAL: ${WISHLIST_RELEASE_INTERVAL:-5m}
      PAYMENT_FEE_BASIS_POINTS: ${PAYMENT_FEE_BASIS_POINTS:-0}
      FEE_WALLET_ID: ${FEE_WALLET_ID:-}
      MARKETPLACE_WALLET_ID: ${MARKETPLACE_WALLET_ID:-}
      LOG_FILE: /logs/wishlist.log
    volumes:
      - ./.logs/wishlist:/logs
  caldron:
    image: wish/caldron:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: caldron
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      wallet:
        condition: service_healthy
      notify:
        condition: service_healthy
    # Порт наружу не публикуется: доступ к сервису только через шлюз (T-001).
    # Для локальной отладки поднимайте профиль debug или пробрасывайте порт вручную.
    expose:
      - "51057"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/wish?sslmode=disable&search_path=caldron
      REDIS_URL: redis://redis:6379/10?protocol=3
      LOG_COLOR: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      WALLET_ADDRESS: ${WALLET_ADDRESS:-wallet:51051}
      NOTIFY_ENDPOINT: ${NOTIFY_ENDPOINT:-http://notify:51055}
      SERVICE_USER_ID: ${SERVICE_USER_ID:-11111111-1111-1111-1111-111111111111}
      CALDRON_REFUND_INTERVAL: ${CALDRON_REFUND_INTERVAL:-5m}
      LOG_FILE: /logs/caldron.log
    volumes:
      - ./.logs/caldron:/logs
  web:
    image: wish/web:latest
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        SERVICE: web
    depends_on:
      krakend:
        condition: service_started
    # Единственный сервис с публикацией порта наружу: это и есть интерфейс,
    # который открывает браузер. API остаётся за шлюзом, сюда приходит
    # только статика.
    ports:
      - "3000:51058"
    healthcheck:
      test: [ "CMD", "/service", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      LOG_COLOR: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # Адрес API отдаётся браузеру отдельным ответом: один и тот же бандл
      # должен работать и на стенде, и в бою.
      WEB_API_BASE: ${WEB_API_BASE:-http://localhost:8080/api/v1}
      WEB_CLIENT_ID: ${WEB_CLIENT_ID:-web}
      LOG_FILE: /logs/web.log
    volumes:
      - ./.logs/web:/logs
