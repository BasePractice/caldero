name: CI

on:
  push:
    branches: [ main, 'stage/**' ]
  pull_request:

# Отменяем предыдущий прогон той же ветки: смысла держать очередь нет.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Форматирование
        run: make fmt-check

      - name: Согласованность go.mod
        run: make tidy-check

      - name: go vet
        run: make vet

      - name: Актуальность сгенерированного кода
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          make proto-check

      - name: Актуальность документа проекта
        run: make docs-check

      - name: Сборка
        run: make build

      - name: Тесты с детектором гонок
        run: make test-race

  docs:
    name: Документ проекта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Typst берётся образом: ставить его в систему ради одной команды
      # незачем, а версия при этом фиксируется тегом.
      - name: Сборка PDF
        run: |
          go run ./tools/bookgen -root .
          docker run --rm -v "$PWD":/work -w /work ghcr.io/typst/typst:latest \
            compile docs/book/main.typ docs/book/caldero.pdf

      - name: Публикация документа
        uses: actions/upload-artifact@v4
        with:
          name: caldero-doc
          path: docs/book/caldero.pdf
          if-no-files-found: error

  integration:
    name: Интеграционные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # testcontainers поднимает PostgreSQL сам, docker на раннере уже есть.
      - name: Тесты репозиториев
        run: make test-integration

  coverage:
    name: Покрытие тестами
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Порог живёт в Makefile: там же, где список исключений, и меняется
      # вместе с ним одним коммитом. Отдельная задача, а не шаг соседней:
      # прогон с покрытием идёт без детектора гонок и параллельно с ним.
      - name: Порог покрытия
        run: make cover

      - name: Публикация профиля
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .cover/all.out
          if-no-files-found: warn

  lint:
    name: Линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Действие v6 ставит golangci-lint v1, а .golangci.yml написан
      # в формате v2 — прогон падал на разборе конфигурации.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  vulnerabilities:
    name: Известные уязвимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: Образы
    runs-on: ubuntu-latest
    strategy:
      # Матрица вместо последовательного цикла: четыре образа собираются
      # параллельно, и падение видно по конкретному сервису.
      fail-fast: false
      matrix:
        service: [ wallet, credit, account, users, notify, wishlist, caldron, web ]
    steps:
      - uses: actions/checkout@v5

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: false
          # Кеш слоёв в GitHub Actions: без него каждый прогон заново
          # выкачивает зависимости и компилирует всё с нуля.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  migrations:
    name: Миграции
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Полный цикл up и down: именно здесь ловятся ошибки порядка удаления
      # таблиц и конфликты между миграциями соседних версий.
      # Тот же скрипт запускается локально через make migrate-check —
      # расхождение между локальной проверкой и CI уже приводило к тому,
      # что ошибку находил только CI.
      - name: Прогон up и down
        run: make migrate-check

  deploy:
    name: Стенд и доставка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Оба файла compose разбираются, а состав стека окружения сверяется
      # с кодом: новый сервис, забытый в deploy/compose.yml, обнаружился бы
      # иначе только на сервере — тем, что его там нет. Слипшиеся строки
      # в docker-compose.yml однажды сломали стенд, и не заметил никто.
      - name: Согласованность с кодом
        run: make deploy-check

  gateway:
    name: Конфигурация шлюза
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Рендер сам по себе мало что доказывает: маршрута страницы входа
      # в шлюзе не было вовсе, шаблон при этом рендерился, а вход через
      # интерфейс просто не начинался. Поэтому здесь же проверяется,
      # что обязательные маршруты на месте.
      #
      # Тот же скрипт запускается локально через make gateway-check.
      - name: Рендер шаблона и обязательные маршруты
        run: make gateway-check
