name: CI

on:
  push:
    branches: [ main, 'stage/**' ]
  pull_request:

# Отменяем предыдущий прогон той же ветки: смысла держать очередь нет.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Форматирование
        run: make fmt-check

      - name: Согласованность go.mod
        run: make tidy-check

      - name: go vet
        run: make vet

      - name: Сборка
        run: make build

      - name: Тесты с детектором гонок
        run: make test-race

  integration:
    name: Интеграционные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # testcontainers поднимает PostgreSQL сам, docker на раннере уже есть.
      - name: Тесты репозиториев
        run: make test-integration

  lint:
    name: Линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Действие v6 ставит golangci-lint v1, а .golangci.yml написан
      # в формате v2 — прогон падал на разборе конфигурации.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  vulnerabilities:
    name: Известные уязвимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: Образы
    runs-on: ubuntu-latest
    strategy:
      # Матрица вместо последовательного цикла: четыре образа собираются
      # параллельно, и падение видно по конкретному сервису.
      fail-fast: false
      matrix:
        service: [ wallet, credit, account, users ]
    steps:
      - uses: actions/checkout@v5

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: false
          # Кеш слоёв в GitHub Actions: без него каждый прогон заново
          # выкачивает зависимости и компилирует всё с нуля.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  migrations:
    name: Миграции
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Полный цикл up и down: именно здесь ловятся ошибки порядка удаления
      # таблиц и конфликты между миграциями соседних версий.
      # Тот же скрипт запускается локально через make migrate-check —
      # расхождение между локальной проверкой и CI уже приводило к тому,
      # что ошибку находил только CI.
      - name: Прогон up и down
        run: make migrate-check

  gateway:
    name: Конфигурация шлюза
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Шаблон шлюза — не JSON, ошибку в нём заметно только после рендера.
      - name: Проверка шаблона в обоих режимах
        run: |
          set -euo pipefail
          for mode in keycloak internal; do
            if [ "$mode" = keycloak ]; then
              host=http://keycloak:8080
              jwks=/realms/krakend/protocol/openid-connect/certs
              token=/realms/krakend/protocol/openid-connect/token
              roles=realm_access.roles
            else
              host=http://users:51053
              jwks=/.well-known/jwks.json
              token=/token
              roles=roles
            fi
            echo "режим $mode"
            docker run --rm -e FC_ENABLE=1 -e FC_OUT=/tmp/out.json \
              -e KRAKEND_NAME=Caldero -e AUTH_HOST="$host" \
              -e AUTH_JWKS_PATH="$jwks" -e AUTH_TOKEN_PATH="$token" \
              -e AUTH_ROLES_CLAIM="$roles" \
              -v "$PWD/config/krakend":/etc/krakend \
              krakend:latest check -c /etc/krakend/krakend.tmpl
          done
