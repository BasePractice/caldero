global:
  # 15 секунд вместо секунды: прежний интервал был избыточен в 15 раз
  # и нагружал сервисы ради данных, которые никто не читает так часто.
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
# - "first_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ 'localhost:9090' ]
        labels:
          app: "prometheus"

  # Метрики отдаются на служебном порту, а не рядом с публичным API.
  # Порт наружу не публикуется, но внутри сети compose доступен.
  - job_name: "wish-services"
    metrics_path: /metrics
    static_configs:
      - targets: [ 'wallet:8081' ]
        labels:
          app: "wallet"
      - targets: [ 'credit:8081' ]
        labels:
          app: "credit"
      - targets: [ 'users:8081' ]
        labels:
          app: "users"
      - targets: [ 'account:8081' ]
        labels:
          app: "account"

  - job_name: "krakend"
    metrics_path: /metrics
    static_configs:
      - targets: [ 'krakend:8090' ]
        labels:
          app: "krakend"
