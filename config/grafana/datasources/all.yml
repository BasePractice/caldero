apiVersion: 1

datasources:
-  access: 'proxy'
   editable: true
   is_default: true
   name: 'influx'
   org_id: 1
   type: 'influxdb'
   url: 'http://influxdb:8086'
   version: 1
   user: ${INFLUXDB_USER}
   secureJsonData:
     password: ${INFLUXDB_PASSWORD}
   database: krakend
-  access: 'proxy'
   editable: true
   is_default: false
   name: 'prometheus'
   org_id: 1
   type: 'prometheus'
   url: 'http://prometheus:9090'
   version: 1
   database: prometheus