input {
  gelf {
    port => 12201
  }
  beats {
    port => 5044
  }
}

filter {
  if [fields][service] {
    mutate {
      add_field => { "[@metadata][service]" => "%{[fields][service]}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][service]" => "unknown" }
    }
  }

  # Записи сервисов приходят уже разобранными из filebeat (ndjson).
  # Записи шлюза — обычный текст, для них остаётся grok.
  if [msg] {
    mutate { rename => { "msg" => "message" } }
  } else {
    grok {
      match => { "message" => '(\[%{WORD}\] %{DATA}%{SPACE}-%{SPACE}%{DATA}%{SPACE}(\[AccessLog\]%{SPACE})?\| %{NUMBER:statusCode} \|%{SPACE}%{NUMBER:duration}(m|µ|n|u)?s%{SPACE}\|%{SPACE}%{DATA:ip}%{SPACE}\|%{SPACE}%{WORD:verb}%{SPACE}"?(?<url>[^"]+)"?)?' }
      tag_on_failure => [ ]
    }
    mutate {
      convert => {
        "statusCode" => "integer"
        "duration" => "float"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => [ "http://elasticsearch:9200" ]
    index => "logs-%{[@metadata][service]}-%{+YYYY.MM.dd}"
    # document_id не задаётся намеренно: прежняя настройка ссылалась
    # на поле uuid, которого в записях нет, поэтому все записи получали
    # один и тот же идентификатор и перезаписывали друг друга.
    # Идентификатор генерирует Elasticsearch.
  }
}
